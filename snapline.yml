version: 1

stack:
  framework: next
  ui: shadcn
  styling: tailwind

components:
  Button:
    import: "@/components/ui/button"
    preferOver:
      - button
  Input:
    import: "@/components/ui/input"
    preferOver:
      - input

# This portfolio's design language: dark theme with primary/accent tokens
# (tailwind.config.js) plus white/black opacity variants as the neutral ramp.
tokens:
  colors:
    semanticOnly: true
    allowed:
      - bg-primary
      - text-primary
      - border-primary
      - bg-accent
      - text-accent
      - border-accent
      - ring-accent
      - bg-accent-hover
      - text-accent-hover
      - bg-white
      - text-white
      - border-white
      - ring-white
      - bg-black
      - text-black
      - border-black
      - bg-surface
      - bg-surface-deep
      - bg-surface-raised
      - border-surface

rules:
  noRawHex: error
  noInlineStyle: error
  noArbitraryTailwind: error
  noRawPaletteColor: warn
  requireButtonComponent: error
  requireInputComponent: error
  requireDialogComponent: warn
  requireCardComponent: warn
  noDuplicateComponents: warn

fix:
  safeAutofix: false
  preferAgentRepair: true

benchmark:
  enabled: true
  scorer: ui-drift-score-v1
