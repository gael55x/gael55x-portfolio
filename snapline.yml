version: 1

stack:
  framework: next
  styling: tailwind

# This portfolio's design language: warm-paper editorial system derived from
# the hero photograph. Tokens live in tailwind.config.js.
tokens:
  colors:
    semanticOnly: true
    allowed:
      - bg-paper
      - bg-paper-deep
      - bg-sand
      - bg-clay
      - bg-clay-deep
      - bg-dusk
      - text-paper
      - text-ink
      - text-ink-soft
      - text-ink-faint
      - text-clay
      - text-clay-deep
      - text-dusk
      - text-dusk-deep
      - border-ink
      - border-clay
      - border-sand
      - border-dusk
      - decoration-clay
      - decoration-ink
      - ring-clay
      - from-paper
      - via-twilight
      - to-ink

rules:
  noRawHex: error
  noInlineStyle: warn
  noArbitraryTailwind: warn
  noRawPaletteColor: warn
  noDuplicateComponents: warn

fix:
  safeAutofix: false
  preferAgentRepair: true

benchmark:
  enabled: true
  scorer: ui-drift-score-v1
